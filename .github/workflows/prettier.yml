name: Prettier

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: caracAL/package-lock.json

      - name: Install dependencies
        working-directory: caracAL
        run: npm ci

      - name: Check changed caracAL files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          FILES="$(git diff --name-only "$BASE" "${{ github.sha }}"             | grep -E '^caracAL/.*\.(js|md|html|css|json)$'             | sed 's#^caracAL/##' || true)"

          if [ -z "$FILES" ]; then
            echo "No changed caracAL files require Prettier."
            exit 0
          fi

          cd caracAL
          echo "$FILES"
          npx prettier --write $FILES
          git diff -- $FILES
          exit 1
