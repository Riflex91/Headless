name: Temporary persistence lockfile

on:
  push:
    branches:
      - phase2/persistence-core-11

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Verify branch is fresh against main
        shell: bash
        run: |
          git fetch origin main
          BEHIND="$(git rev-list --count HEAD..origin/main)"
          echo "behind_by=$BEHIND"
          if [ "$BEHIND" != "0" ]; then
            echo "Branch is stale; refusing lockfile write."
            exit 1
          fi

      - name: Generate package lock
        working-directory: caracAL
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- caracAL/package-lock.json; then
            echo "No lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add caracAL/package-lock.json
          git commit -m "build: update lockfile for sqlite3"
          git push origin "HEAD:${GITHUB_REF_NAME}"
